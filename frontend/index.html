<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E7C86" />
    <meta name="description" content="Seguimiento de hidratación personalizado con recordatorios inteligentes" />
    <title>HydrApp</title>
    <script>
      // Aplica el tema antes del primer render de React para evitar el
      // flash de tema incorrecto (FOUC) al cargar. Debe quedar en sync con
      // la lógica de context/ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem("hydrapp_theme") || "system";
          var isDark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        } catch (e) {
          // localStorage puede fallar en modo privado estricto; no rompe nada, queda claro.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
